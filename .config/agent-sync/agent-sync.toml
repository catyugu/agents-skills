# Per-client knobs for the servers declared in mcp.json.
#
# agent-sync reads this from $XDG_CONFIG_HOME/agent-sync/; scripts/agents.mjs
# points XDG_CONFIG_HOME at .config/ for the sync process only, so a bare
# `agent-sync` run sees neither these tweaks nor AGENTS_HOME.
#
# Codex asks before every browser action: chrome-devtools-mcp drives the user's
# real Chrome profile, where a stray click is not undoable. `prompt` means "ask
# every time"; `approve` means the opposite, already approved.
#
# This binds Codex only; every other client keeps its own permission policy.

[mcp.chrome.tweaks.codex]
default_tools_approval_mode = "prompt"
