name: reproduce

# The acceptance test this repo claims: a fresh clone plus Git, pnpm, uv, Node and
# one agent client rebuilds the whole toolchain from the committed lockfiles, and
# renders the same client config, on every platform.
#
# The clone goes to $HOME/.agents, not into the runner's workspace, because that
# is the path codex and friends open by themselves: a sync performed anywhere else
# proves nothing about native skill discovery. The job then fakes the one thing a
# runner cannot have (an installed client directory), bootstraps, and asserts that
# the second sync is a no-op, that the repo invariants hold, and that every MCP
# server starts and answers the protocol handshake.
#
# What it cannot prove: that a specific client parses what it finds. Chrome needs
# a running Chrome and Zotero needs the Zotero desktop app, so the MCP step stops
# at initialize + tools/list and calls no tool.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: reproduce-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rebuild:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7.0.1

      # The base tools the repo assumes, at the versions it was tested with: the
      # pnpm version matches packageManager, and uv is pinned so a runner cannot
      # resolve the lockfiles with a resolver the repo has never seen.
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.14.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          version: 0.9.22

      # agent-sync never creates a client directory, so without one the sync would
      # have nothing to fan out to and would pass vacuously.
      - name: Put the repo where a client reads it
        shell: bash
        run: |
          git clone --quiet "$GITHUB_WORKSPACE" "$HOME/.agents"
          mkdir -p "$HOME/.codex"

      - name: Rebuild from the lockfiles and sync
        shell: bash
        run: node "$HOME/.agents/scripts/bootstrap.mjs"

      - name: Assert the second sync is a no-op
        shell: bash
        run: node "$HOME/.agents/scripts/agents.mjs" status

      - name: Check repo invariants and the rendered config
        shell: bash
        run: node "$HOME/.agents/scripts/check.mjs"

      # The view is generated and uncommitted, so this proves the clone produced
      # it: every skill under library/ must be reachable at skills/<name> as a link.
      - name: Check the skills view is current
        shell: bash
        run: node "$HOME/.agents/scripts/skills.mjs" --check

      - name: Handshake with every MCP server
        shell: bash
        run: uv run --project "$HOME/.agents/python" --locked python "$HOME/.agents/scripts/mcp_probe.py"

      - name: Record what the Commons resolved to
        if: always()
        shell: bash
        run: node "$HOME/.agents/scripts/agents.mjs" mcp list
